<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace recruteur — Chasseur de tête</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <style>
    /* ===== SIDEBAR ===== */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100vh;
      background: #fff;
      border-right: 1px solid var(--gray-100);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.02);
    }

    .logo {
      font-size: 18px;
      margin-bottom: 20px;
    }

    /* Navigation verticale */
    .nav-links-horizontal {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-item-h {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gray-500);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .nav-item-h:hover {
      background: #f1f5f9;
      color: var(--primary);
    }

    .nav-item-h.active {
      background: #eef2ff;
      color: var(--primary);
      font-weight: 600;
    }

    /* Boutons en bas */
    .nav-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Contenu principal */
    .recruteur-main-content {
      margin-left: 260px;
      padding: 40px;
      max-width: 1200px;
    }
  </style>
</head>

<body class="dashboard-recruteur" style="background: #f8fafc;">

  <!-- ===== SIDEBAR ===== -->
  <header class="top-nav">

    <a href="index.html" class="logo"><i>CHASSEUR DE TÊTE</i></a>

    <nav class="nav-links-horizontal">
      <a href="#" class="nav-item-h active" id="nav-overview" onclick="showSection('offresSection')">
        <span>Tableau de bord</span>
      </a>

      <a href="#" class="nav-item-h" id="nav-alloffres" onclick="showSection('allOffresSection')">
        <span>Toutes les offres</span>
      </a>

      <a href="#" class="nav-item-h" id="nav-pipeline" onclick="showSection('pipelineSection')">
        <span>Pipeline</span>
      </a>

      <a href="messagerie.html" class="nav-item-h">
        <span>Messagerie</span>
      </a>
    </nav>

    <div class="nav-bottom">
      <button class="btn btn-primary btn-sm" onclick="showSection('newOffreSection')">+ Mission</button>
      <button class="btn btn-outline btn-sm" onclick="logout()">Déconnexion</button>
    </div>

  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="recruteur-main-content">
    
    <header style="margin-bottom: 32px;">
      <h1 id="welcomeTitle" style="font-size: 24px; font-weight: 800;">Espace Recruteur</h1>
      <p class="text-muted">Gérez vos talents et vos missions de recrutement</p>
    </header>

    <!-- Stats -->
    <div class="admin-stats-grid" id="statsGrid">
      <div class="admin-stat-card">
        <div class="admin-stat-info">
          <h3>Missions actives</h3>
          <div class="value" id="sOffres">—</div>
        </div>
      </div>

      <div class="admin-stat-card">
        <div class="admin-stat-info">
          <h3>Talents captés</h3>
          <div class="value" id="sCandidatures">—</div>
        </div>
      </div>

      <div class="admin-stat-card">
        <div class="admin-stat-info">
          <h3>Total missions</h3>
          <div class="value" id="sTotal">—</div>
        </div>
      </div>
    </div>

    <!-- Offres -->
    <div id="offresSection" class="admin-card">
      <h2>Mes missions en cours</h2>
      <div id="offresList">
        <p class="empty-state">Chargement…</p>
      </div>
    </div>

    <!-- Nouvelle offre -->
    <div id="newOffreSection" class="admin-card" style="display:none;">
      <h2>Publier une mission</h2>
      <form id="newOffreForm">
        <input id="of-titre" type="text" placeholder="Titre" required />
        <textarea id="of-desc" placeholder="Description" required></textarea>
        <button type="submit">Publier</button>
      </form>
    </div>

    <!-- Pipeline -->
    <div id="pipelineSection" style="display:none;">
      <h2>Pipeline</h2>
      <div id="kanban"></div>
    </div>

    <!-- Toutes les offres -->
    <div id="allOffresSection" style="display:none;">
      <h2>Toutes les offres</h2>
      <div id="allOffresList"></div>
    </div>

  </main>

  <script src="main.js"></script>
  <script src="dashboard-recruteur.js"></script>

  <script>
    const originalShowSection = window.showSection;
    window.showSection = function(id) {
      if (typeof originalShowSection === 'function') originalShowSection(id);

      document.querySelectorAll('.nav-item-h').forEach(nav => {
        nav.classList.remove('active');

        if (id === 'offresSection' && nav.id === 'nav-overview') nav.classList.add('active');
        if (id === 'allOffresSection' && nav.id === 'nav-alloffres') nav.classList.add('active');
        if (id === 'pipelineSection' && nav.id === 'nav-pipeline') nav.classList.add('active');
      });
    };
  </script>

</body>
</html>
