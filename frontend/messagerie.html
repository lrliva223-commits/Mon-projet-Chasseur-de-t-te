<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie Sécurisée — Chasseur de tête</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .nav-simple { background: #fff; padding: 12px 24px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .btn-back { display: flex; align-items: center; gap: 8px; color: var(--gray-600); text-decoration: none; font-size: 14px; font-weight: 500; }
    .btn-back:hover { color: var(--primary); }
    .main-layout { flex: 1; display: flex; overflow: hidden; padding: 20px; gap: 20px; }
  </style>
</head>
<body>

  <nav class="nav-simple">
    <div class="flex items-center gap-4">
      <a href="index.html" class="logo" style="font-size: 18px;"><i>CHASSEUR DE TÊTE</i></a>
      <span style="color: var(--gray-300)">|</span>
      <span style="font-weight: 600; color: var(--gray-800)">Messagerie Privée</span>
    </div>
    <div id="backToDash">
       <!-- Sera rempli par JS selon le rôle -->
    </div>
  </nav>

  <div class="main-layout">
    <div class="messagerie" style="margin:0; width:100%; height:100%">
      <!-- Liste conversations -->
      <div class="conv-list" id="convList">
        <div style="padding:20px; border-bottom:1px solid var(--gray-100)">
          <h2 style="font-size: 18px; font-weight: 800;">Discussions</h2>
          <p style="font-size: 12px; color: var(--gray-400)">Mises à jour en temps réel</p>
        </div>
        <div id="convItems" style="flex:1; overflow-y:auto">
          <p class="empty-state" style="padding:40px">Chargement de vos conversations…</p>
        </div>
      </div>

      <!-- Zone chat -->
      <div class="chat-area" id="chatArea">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--gray-400); background:#f8fafc">
          <div style="background:#fff; padding:30px; border-radius:50%; margin-bottom:20px; box-shadow:0 10px 20px rgba(0,0,0,0.05)">
            <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
          </div>
          <p style="font-weight:600">Sélectionnez un contact pour discuter</p>
          <p style="font-size:13px">Vos échanges sont sécurisés et confidentiels</p>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="messagerie.js"></script>
  <script>
    // Gérer le bouton retour selon le rôle
    const user = HH.auth.getUser();
    const backArea = document.getElementById('backToDash');
    if (user) {
      const map = { 
        candidat: 'dashboard-candidat.html', 
        recruteur: 'dashboard-recruteur.html', 
        entreprise: 'dashboard-entreprise.html', 
        admin: 'dashboard-admin.html' 
      };
      const link = map[user.role] || 'index.html';
      backArea.innerHTML = `<a href="${link}" class="btn-back">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        Retour au tableau de bord
      </a>`;
    }
  </script>
</body>
</html>
